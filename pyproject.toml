[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-copilot"
version = "0.0.0"
description = "AI-Powered Test Generation and Defect Triage Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan Patel" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "greenlet==3.1.1",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "celery==5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[project.scripts]
qe = "qe_cli.__main__:main"

# ADR-0001: prefixed importable packages discovered across multiple roots so
# apps/ and packages/ share one code path with no duplication or name collision.
[tool.setuptools.packages.find]
where = [
    "packages/auth",
    "packages/common",
    "packages/database",
    "packages/ai_gateway",
    "packages/observability",
    "packages/security",
    "apps/api",
    "apps/worker",
    "apps/scheduler",
    "apps/cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", ".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "qe_auth",
    "qe_common",
    "qe_database",
    "qe_ai_gateway",
    "qe_observability",
    "qe_security",
    "qe_api",
    "qe_worker",
    "qe_scheduler",
    "qe_cli",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/auth",
    "packages/common",
    "packages/database",
    "packages/ai_gateway",
    "packages/observability",
    "packages/security",
    "apps/api",
    "apps/worker",
    "apps/scheduler",
    "apps/cli",
    "tests",
]
exclude = ["apps/web", "\\.venv", "migrations/versions"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "packages/auth",
    "packages/common",
    "packages/database",
    "packages/ai_gateway",
    "packages/observability",
    "packages/security",
    "apps/api",
    "apps/worker",
    "apps/scheduler",
    "apps/cli",
]
markers = [
    "integration: tests that require live Postgres/Redis services",
]
